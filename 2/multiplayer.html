<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peer Challenge - Math - KooBits</title>
  <!-- Google Fonts for typography -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@600;800;900&display=swap">
  <!-- FontAwesome Icons for small caret arrows -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- External CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- TOP NAVBAR -->
  <header class="navbar">
    <div class="nav-left">
      <div class="logo" onclick="window.location.href='index.html'">
        <img src="icon.png" alt="KooBits Icon" class="logo-img">
      </div>
      <div class="badge-school">
        <img src="school.png" alt="School" class="nav-png-icon" style="width:16px; height:16px;">
        School <i class="fa-solid fa-caret-down"></i>
      </div>
    </div>

    <nav class="nav-center">
      <a href="index.html" class="nav-icon-link" title="Home">
        <img src="home.png" alt="Home" class="nav-png-icon">
      </a>
      <a href="#" class="nav-icon-link" title="Report">
        <img src="report.png" alt="Report" class="nav-png-icon">
      </a>
      <a href="#" class="nav-icon-link" title="Leaderboard">
        <img src="leaderboard.png" alt="Leaderboard" class="nav-png-icon">
      </a>
      <a href="#" class="nav-icon-link" title="Friends">
        <img src="friends.png" alt="Friends" class="nav-png-icon">
      </a>
      <a href="#" class="nav-icon-link" title="Awards">
        <img src="awards.png" alt="Awards" class="nav-png-icon">
      </a>
    </nav>

    <div class="nav-right">
      <div class="streak-pill">
        <span>0</span> 
        <img src="streak.gif" alt="Streak" class="nav-gif-icon" style="width:16px; height:16px;">
      </div>
      <div class="nav-icon-link" title="Menu" onclick="toggleMenuModal()">
        <img src="menu.png" alt="Menu" class="nav-png-icon">
      </div>
      <div class="user-avatar-mini" onclick="window.location.href='dashboard.html'">
        <img src="user.png" alt="User Avatar" style="width:100%; height:100%; object-fit:cover;">
      </div>
    </div>
  </header>

  <!-- SUB-HEADER BAR -->
  <div class="sub-header">
    <a href="dashboard.html" class="btn-back">
      <i class="fa-solid fa-chevron-left"></i> Back
    </a>
    
    <div class="header-title-container">
      <h1 class="header-title">Peer Challenge - Math</h1>
      <span class="header-subtitle">You have 5 challenge remaining today</span>
    </div>

    <div class="header-right-actions">
      <div class="action-badge">
        <i class="fa-solid fa-hand-point-right"></i>
        <span>Incoming</span>
      </div>
      <div class="action-badge">
        <i class="fa-solid fa-clock-rotate-left"></i>
        <span>History</span>
      </div>
      <div class="action-badge">
        <i class="fa-solid fa-book-open"></i>
        <span>Rules</span>
      </div>
    </div>
  </div>

  <!-- MAIN CONTAINER -->
  <main class="main-container">

    <!-- RECENT SIDEBAR -->
    <aside class="recent-sidebar">
      <div class="recent-heading">Recent</div>
      <div class="recent-card">
        <div class="recent-avatar"><img src="user.png" style="width:100%;height:100%;object-fit:cover;"></div>
        <span class="recent-name">Hayden</span>
      </div>
      <div class="recent-card">
        <div class="recent-avatar"><img src="user.png" style="width:100%;height:100%;object-fit:cover;"></div>
        <span class="recent-name">Howard</span>
      </div>
      <div class="recent-card">
        <div class="recent-avatar"><img src="user.png" style="width:100%;height:100%;object-fit:cover;"></div>
        <span class="recent-name">Keah</span>
      </div>
    </aside>

    <!-- CHALLENGER CONFIGURATION AREA -->
    <section class="challenger-content">
      <h2 class="section-title">Choose your challenger</h2>

      <div class="challenger-cards-grid">
        <!-- Box 1: My Classmate -->
        <div class="challenger-box">
          <div class="box-top-banner">My Classmate</div>
          <div class="box-body">
            <img src="multiplayer.png" alt="Classmate" class="box-icon-graphic">
            <select class="custom-select">
              <option>Select Class</option>
            </select>
            <select class="custom-select">
              <option>Select Student</option>
            </select>
          </div>
        </div>

        <!-- Box 2: My Friend -->
        <div class="challenger-box">
          <div class="box-top-banner orange">My Friend</div>
          <div class="box-body">
            <img src="friends.png" alt="Friend" class="box-icon-graphic">
            <select class="custom-select">
              <option>Search BFF code or ID</option>
            </select>
            <select class="custom-select">
              <option>Select My BFF</option>
            </select>
          </div>
        </div>

        <!-- Box 3: Random Challenger -->
        <div class="challenger-box">
          <div class="box-top-banner bright-orange">Random Challenger</div>
          <div class="box-body">
            <div class="random-avatar-circle">
              <i class="fa-solid fa-user-secret" style="font-size: 2rem; color: #d97706;"></i>
            </div>
            <span class="random-name">Enzo</span>
          </div>
        </div>
      </div>

      <button class="btn-start-challenge" onclick="startChallenge()">Start Challenge</button>
    </section>

  </main>

  <!-- ================= MENU OVERLAY MODAL ================= -->
  <div id="menuModal" class="menu-modal-overlay">
    <header class="navbar">
      <div class="nav-left">
        <div class="logo" onclick="toggleMenuModal(); window.location.href='dashboard.html';">
          <img src="icon.png" alt="KooBits Icon" class="logo-img">
        </div>
        <div class="badge-school">
          <img src="school.png" alt="School" class="nav-png-icon" style="width:16px; height:16px;">
          School <i class="fa-solid fa-caret-down"></i>
        </div>
      </div>

      <nav class="nav-center">
        <a href="dashboard.html" class="nav-icon-link" title="Home">
          <img src="home.png" alt="Home" class="nav-png-icon">
        </a>
        <a href="#" class="nav-icon-link" title="Report">
          <img src="report.png" alt="Report" class="nav-png-icon">
        </a>
        <a href="#" class="nav-icon-link" title="Leaderboard">
          <img src="leaderboard.png" alt="Leaderboard" class="nav-png-icon">
        </a>
        <a href="#" class="nav-icon-link" title="Friends">
          <img src="friends.png" alt="Friends" class="nav-png-icon">
        </a>
        <a href="#" class="nav-icon-link" title="Awards">
          <img src="awards.png" alt="Awards" class="nav-png-icon">
        </a>
      </nav>

      <div class="nav-right">
        <div class="streak-pill">
          <span>0</span> 
          <img src="streak.gif" alt="Streak" class="nav-gif-icon" style="width:16px; height:16px;">
        </div>
        <div class="nav-icon-link" title="Menu" onclick="toggleMenuModal()">
          <img src="menu.png" alt="Menu" class="nav-png-icon">
        </div>
        <div class="user-avatar-mini" onclick="toggleMenuModal(); window.location.href='dashboard.html';">
          <img src="user.png" alt="User Avatar" style="width:100%; height:100%; object-fit:cover;">
        </div>
      </div>
    </header>

    <div class="menu-grid-content">
      <div class="menu-item" onclick="window.location.href='multiplayer.html'">
        <div class="menu-item-icon-wrap"><img src="multiplayer.png"></div>
        <span>Peer Challenge</span>
      </div>
      <div class="menu-item" onclick="window.location.href='daily-challenge.html'">
        <div class="menu-item-icon-wrap"><img src="mission.png"></div>
        <span>Daily Challenge</span>
      </div>
      <div class="menu-item" onclick="window.location.href='events.html'">
        <div class="menu-item-icon-wrap"><img src="events.png"></div>
        <span>Sunday Mini</span>
      </div>
      <div class="menu-item" onclick="window.location.href='assignment.html'">
        <div class="menu-item-icon-wrap"><img src="assignment.png"></div>
        <span>Assignment</span>
      </div>
      <div class="menu-item" onclick="window.location.href='brain-games.html'">
        <div class="menu-item-icon-wrap"><img src="brain-games.svg"></div>
        <span>Brain Games</span>
      </div>
      <div class="menu-item" onclick="window.location.href='storymath.html'">
        <div class="menu-item-icon-wrap"><img src="story.svg"></div>
        <span>StoryMath</span>
      </div>
      <div class="menu-item" onclick="window.location.href='mission.html'">
        <div class="menu-item-icon-wrap"><img src="mission.png"></div>
        <span>Mission</span>
      </div>
      <div class="menu-item" onclick="logoutUser()">
        <div class="menu-item-icon-wrap"><i class="fa-solid fa-right-from-bracket" style="font-size: 24px; color: #ffffff;"></i></div>
        <span>Logout</span>
      </div>
    </div>
  </div>

  <script>
    function startChallenge() {
      alert('Starting Peer Challenge match!');
    }

    function toggleMenuModal() {
      const modal = document.getElementById('menuModal');
      if (modal.classList.contains('active')) {
        modal.classList.remove('active');
        setTimeout(() => {
          modal.style.display = 'none';
        }, 300);
      } else {
        modal.style.display = 'flex';
        setTimeout(() => {
          modal.classList.add('active');
        }, 10);
      }
    }

    function logoutUser() {
      window.location.href = 'index.html';
    }
  </script>

</body>
</html>
