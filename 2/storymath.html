<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StoryMath - KooBits</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;700;800;900&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- External CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <div class="nav-left">
      <div class="logo" onclick="window.location.href='dashboard.html'">
        <img src="icon.png" alt="koobits icon" class="logo-img">
      </div>
      <div class="badge-school">
        <img src="school.png" alt="school" class="nav-png-icon" style="width:16px; height:16px;">
        School <i class="fa-solid fa-caret-down"></i>
      </div>
    </div>
    <nav class="nav-center">
      <a href="dashboard.html" class="nav-icon-link" title="Home"><img src="home.png" alt="home" class="nav-png-icon"></a>
      <a href="report.html" class="nav-icon-link" title="Report"><img src="report.png" alt="report" class="nav-png-icon"></a>
      <a href="leaderboard.html" class="nav-icon-link" title="Leaderboard"><img src="leaderboard.png" alt="leaderboard" class="nav-png-icon"></a>
      <a href="friends.html" class="nav-icon-link" title="Friends"><img src="friends.png" alt="friends" class="nav-png-icon"></a>
      <a href="awards.html" class="nav-icon-link" title="Awards"><img src="awards.png" alt="awards" class="nav-png-icon"></a>
    </nav>
    <div class="nav-right">
      <div class="streak-pill"><span>0</span> <img src="streak.gif" alt="streak" class="nav-gif-icon" style="width:16px; height:16px;"></div>
      <div class="nav-icon-link" title="Menu" onclick="toggleMenuModal()"><img src="menu.png" alt="menu" class="nav-png-icon"></div>
      <div class="user-avatar-mini" onclick="window.location.href='dashboard.html'"><img src="user.png" alt="user avatar" style="width:100%; height:100%; object-fit:cover;"></div>
    </div>
  </header>

  <div class="sub-header">
    <a href="dashboard.html" class="btn-back"><i class="fa-solid fa-chevron-left"></i> Back</a>
    <div class="header-title-container"><h1 class="header-title">KooBits Story</h1></div>
    <div class="header-spacer"></div>
  </div>

  <main class="main-container">
    <div class="story-card">
      <div class="card-left">
        <img src="https://student.koobits.com/assets/story-math-Dhcl8US_.png" alt="StoryMath" class="story-thumbnail">
        <div class="story-details">
          <h2 class="story-title">StoryMath</h2>
          <div class="story-subtitle">The Adventures of Miko the Fox</div>
          <div class="books-info">
            Total Books
            <div class="books-count"><i class="fa-solid fa-book-open"></i> 31</div>
          </div>
        </div>
      </div>
      <div class="card-right">
        <a href="storymath-stories.html" class="btn-read">Read</a>
      </div>
    </div>
  </main>

  <!-- ================= MENU OVERLAY MODAL ================= -->
  <div id="menuModal" class="menu-modal-overlay">
    <header class="navbar">
      <div class="nav-left">
        <div class="logo" onclick="toggleMenuModal(); window.location.href='dashboard.html';">
          <img src="icon.png" alt="KooBits Icon" class="logo-img">
        </div>
        <div class="badge-school">
          <img src="school.png" alt="School" class="nav-png-icon" style="width:16px; height:16px;">
          School <i class="fa-solid fa-caret-down"></i>
        </div>
      </div>

      <nav class="nav-center">
        <a href="dashboard.html" class="nav-icon-link" title="Home">
          <img src="home.png" alt="Home" class="nav-png-icon">
        </a>
        <a href="report.html" class="nav-icon-link" title="Report">
          <img src="report.png" alt="Report" class="nav-png-icon">
        </a>
        <a href="leaderboard.html" class="nav-icon-link" title="Leaderboard">
          <img src="leaderboard.png" alt="Leaderboard" class="nav-png-icon">
        </a>
        <a href="friends.html" class="nav-icon-link" title="Friends">
          <img src="friends.png" alt="Friends" class="nav-png-icon">
        </a>
        <a href="awards.html" class="nav-icon-link" title="Awards">
          <img src="awards.png" alt="Awards" class="nav-png-icon">
        </a>
      </nav>

      <div class="nav-right">
        <div class="streak-pill">
          <span>0</span> 
          <img src="streak.gif" alt="Streak" class="nav-gif-icon" style="width:16px; height:16px;">
        </div>
        <div class="nav-icon-link" title="Menu" onclick="toggleMenuModal()">
          <img src="menu.png" alt="Menu" class="nav-png-icon">
        </div>
        <div class="user-avatar-mini" onclick="toggleMenuModal(); window.location.href='dashboard.html';">
          <img src="user.png" alt="User Avatar" style="width:100%; height:100%; object-fit:cover;">
        </div>
      </div>
    </header>

    <div class="menu-grid-content">
      <div class="menu-item" onclick="window.location.href='multiplayer.html'">
        <div class="menu-item-icon-wrap"><img src="multiplayer.png"></div>
        <span>Peer Challenge</span>
      </div>
      <div class="menu-item" onclick="window.location.href='daily-challenge.html'">
        <div class="menu-item-icon-wrap"><img src="mission.png"></div>
        <span>Daily Challenge</span>
      </div>
      <div class="menu-item" onclick="window.location.href='events.html'">
        <div class="menu-item-icon-wrap"><img src="events.png"></div>
        <span>Sunday Mini</span>
      </div>
      <div class="menu-item" onclick="window.location.href='assignment.html'">
        <div class="menu-item-icon-wrap"><img src="assignment.png"></div>
        <span>Assignment</span>
      </div>
      <div class="menu-item" onclick="window.location.href='brain-games.html'">
        <div class="menu-item-icon-wrap"><img src="brain-games.svg"></div>
        <span>Brain Games</span>
      </div>
      <div class="menu-item" onclick="window.location.href='storymath.html'">
        <div class="menu-item-icon-wrap"><img src="story.svg"></div>
        <span>StoryMath</span>
      </div>
      <div class="menu-item" onclick="window.location.href='mission.html'">
        <div class="menu-item-icon-wrap"><img src="mission.png"></div>
        <span>Mission</span>
      </div>
      <div class="menu-item" onclick="logoutUser()">
        <div class="menu-item-icon-wrap"><i class="fa-solid fa-right-from-bracket" style="font-size: 24px; color: #ffffff;"></i></div>
        <span>Logout</span>
      </div>
    </div>
  </div>

  <script>
    function toggleMenuModal() {
      const modal = document.getElementById('menuModal');
      if (modal.classList.contains('active')) {
        modal.classList.remove('active');
        setTimeout(() => {
          modal.style.display = 'none';
        }, 300);
      } else {
        modal.style.display = 'flex';
        setTimeout(() => {
          modal.classList.add('active');
        }, 10);
      }
    }

    function logoutUser() {
      window.location.href = 'index.html';
    }
  </script>

</body>
</html>
