<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KooBits Brain Games</title>
  
  <!-- Google Fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@700;800;900&display=swap">
  
  <!-- FontAwesome for Top Nav Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- External CSS -->
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      background-color: #333333 !important;
    }

    /* Embedded Game View Styles */
    #gameEmbedContainer {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000000;
      z-index: 10;
      flex-direction: column;
    }

    .game-embed-header {
      background: #2b303a;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #ffffff;
      font-family: 'Fredoka', cursive;
    }

    .btn-close-game {
      background: #ff6b2b;
      color: #ffffff;
      border: none;
      padding: 6px 16px;
      border-radius: 16px;
      font-family: 'Fredoka', cursive;
      font-weight: 600;
      cursor: pointer;
    }

    #gameIframe {
      flex: 1;
      width: 100%;
      border: none;
    }

    /* Circular Category Image Buttons with Bottom Text */
    .cat-circle {
      position: absolute;
      width: 18%;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s;
      background: transparent;
      box-shadow: none;
      padding: 0;
    }

    .cat-circle:hover {
      transform: scale(1.08);
    }

    .cat-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      border: 3px solid #ffffff;
    }

    .cat-label {
      position: absolute;
      bottom: -22px;
      font-family: 'Fredoka', cursive;
      font-size: 0.85rem;
      font-weight: 600;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      white-space: nowrap;
      background: rgba(0, 0, 0, 0.6);
      padding: 2px 8px;
      border-radius: 10px;
    }
  </style>
</head>
<body class="kooisland-page">

  <!-- TOP NAVBAR -->
  <header class="navbar">
    <div class="nav-left">
      <div class="logo" onclick="goToDashboard()">
        <img src="icon.png" alt="koobits icon" class="logo-img">
      </div>
      <div class="badge-school">
        <img src="school.png" alt="school" class="nav-png-icon" style="width:16px; height:16px;">
        School <i class="fa-solid fa-caret-down"></i>
      </div>
    </div>

    <nav class="nav-center">
      <a href="dashboard.html" class="nav-icon-link" title="Home">
        <img src="home.png" alt="home" class="nav-png-icon">
      </a>
      <a href="#" class="nav-icon-link" title="Report">
        <img src="report.png" alt="report" class="nav-png-icon">
      </a>
      <a href="#" class="nav-icon-link" title="Leaderboard">
        <img src="leaderboard.png" alt="leaderboard" class="nav-png-icon">
      </a>
      <a href="#" class="nav-icon-link" title="Friends">
        <img src="friends.png" alt="friends" class="nav-png-icon">
      </a>
      <a href="#" class="nav-icon-link" title="Awards">
        <img src="awards.png" alt="awards" class="nav-png-icon">
      </a>
    </nav>

    <div class="nav-right">
      <div class="streak-pill">
        <span>0</span> 
        <img src="streak.gif" alt="streak" class="nav-gif-icon" style="width:16px; height:16px;">
      </div>
      <div class="nav-icon-link" title="Menu" onclick="toggleMenuModal()">
        <img src="menu.png" alt="menu" class="nav-png-icon">
      </div>
      <div class="user-avatar-mini" onclick="goToDashboard()">
        <img src="user.png" alt="user avatar" style="width:100%; height:100%; object-fit:cover;">
      </div>
    </div>
  </header>

  <!-- ==================== MAIN CONTENT AREA ==================== -->
  <main class="main-content">
    
    <!-- Top Centered Logo -->
    <div class="top-logo-container">
      <img src="brain-games.png" alt="koobits brain games" class="top-logo">
    </div>

    <!-- Island Map Wrapper -->
    <div class="island-wrapper">
      <img src="map.png" alt="koobits island map" class="island-bg">

      <!-- VIEW 1: START BUTTON -->
      <div id="startOverlay">
        <button class="btn-start" onclick="showGamesSelection()">START</button>
      </div>

      <!-- VIEW 2: CATEGORY CIRCLES -->
      <div id="selectionOverlay" style="display: none;">
        <div class="cat-circle pos-memory" onclick="launchGame('https://eaglercraft1-8.github.io/')">
          <img src="eaglercraft.png" alt="Eaglercraft" class="cat-img">
          <span class="cat-label">Eaglercraft</span>
        </div>
        <div class="cat-circle pos-flexibility" onclick="launchGame('https://bloxd.io')">
          <img src="bloxd.png" alt="Bloxd.io" class="cat-img">
          <span class="cat-label">Bloxd.io</span>
        </div>
        <div class="cat-circle pos-speed" onclick="launchGame('https://infinite-craft.net/')">
          <img src="infinite-craft.png" alt="Infinite Craft" class="cat-img">
          <span class="cat-label">Infinite Craft</span>
        </div>
        <div class="cat-circle pos-adventure" onclick="launchGame('https://1games.io/')">
          <img src="1games.png" alt="1Games" class="cat-img">
          <span class="cat-label">1Games</span>
        </div>
        <div class="cat-circle pos-attention" onclick="launchGame('https://geometrydash.com/')">
          <img src="geometry-dash.png" alt="Geometry Dash" class="cat-img">
          <span class="cat-label">Geometry Dash</span>
        </div>
        <div class="cat-circle pos-problemsolving" onclick="openCustomGame()">
          <img src="custom.png" alt="Custom Game" class="cat-img" onerror="this.src='error.png'">
          <span class="cat-label">Custom</span>
        </div>
      </div>

      <!-- EMBEDDED GAME VIEW CONTAINER -->
      <div id="gameEmbedContainer">
        <div class="game-embed-header">
          <span id="gameEmbedTitle">Game</span>
          <button class="btn-close-game" onclick="closeGameEmbed()">Exit Game</button>
        </div>
        <iframe id="gameIframe" src=""></iframe>
      </div>
    </div>

  </main>

  <!-- ================= MENU OVERLAY MODAL (UNIVERSAL BAR) ================= -->
  <div id="menuModal" class="menu-modal-overlay">
    <header class="navbar">
      <div class="nav-left">
        <div class="logo" onclick="toggleMenuModal(); goToDashboard();">
          <img src="icon.png" alt="KooBits Icon" class="logo-img">
        </div>
        <div class="badge-school">
          <img src="school.png" alt="School" class="nav-png-icon" style="width:16px; height:16px;">
          School <i class="fa-solid fa-caret-down"></i>
        </div>
      </div>

      <nav class="nav-center">
        <a href="dashboard.html" class="nav-icon-link" title="Home">
          <img src="home.png" alt="Home" class="nav-png-icon">
        </a>
        <a href="#" class="nav-icon-link" title="Report">
          <img src="report.png" alt="Report" class="nav-png-icon">
        </a>
        <a href="#" class="nav-icon-link" title="Leaderboard">
          <img src="leaderboard.png" alt="Leaderboard" class="nav-png-icon">
        </a>
        <a href="#" class="nav-icon-link" title="Friends">
          <img src="friends.png" alt="Friends" class="nav-png-icon">
        </a>
        <a href="#" class="nav-icon-link" title="Awards">
          <img src="awards.png" alt="Awards" class="nav-png-icon">
        </a>
      </nav>

      <div class="nav-right">
        <div class="streak-pill">
          <span>0</span> 
          <img src="streak.gif" alt="Streak" class="nav-gif-icon" style="width:16px; height:16px;">
        </div>
        <div class="nav-icon-link" title="Menu" onclick="toggleMenuModal()">
          <img src="menu.png" alt="Menu" class="nav-png-icon">
        </div>
        <div class="user-avatar-mini" onclick="toggleMenuModal(); goToDashboard();">
          <img src="user.png" alt="User Avatar" style="width:100%; height:100%; object-fit:cover;">
        </div>
      </div>
    </header>

    <div class="menu-grid-content">
      <div class="menu-item" onclick="window.location.href='multiplayer.html'">
        <div class="menu-item-icon-wrap"><img src="multiplayer.png"></div>
        <span>Peer Challenge</span>
      </div>
      <div class="menu-item" onclick="window.location.href='daily-challenge.html'">
        <div class="menu-item-icon-wrap"><img src="mission.png"></div>
        <span>Daily Challenge</span>
      </div>
      <div class="menu-item" onclick="window.location.href='events.html'">
        <div class="menu-item-icon-wrap"><img src="events.png"></div>
        <span>Sunday Mini</span>
      </div>
      <div class="menu-item" onclick="window.location.href='assignment.html'">
        <div class="menu-item-icon-wrap"><img src="assignment.png"></div>
        <span>Assignment</span>
      </div>
      <div class="menu-item" onclick="window.location.href='brain-games.html'">
        <div class="menu-item-icon-wrap"><img src="brain-games.svg"></div>
        <span>Brain Games</span>
      </div>
      <div class="menu-item" onclick="window.location.href='storymath.html'">
        <div class="menu-item-icon-wrap"><img src="story.svg"></div>
        <span>StoryMath</span>
      </div>
      <div class="menu-item" onclick="window.location.href='mission.html'">
        <div class="menu-item-icon-wrap"><img src="mission.png"></div>
        <span>Mission</span>
      </div>
      <div class="menu-item" onclick="logoutUser()">
        <div class="menu-item-icon-wrap"><i class="fa-solid fa-right-from-bracket" style="font-size: 24px; color: #ffffff;"></i></div>
        <span>Logout</span>
      </div>
    </div>
  </div>

  <!-- AUDIO ELEMENT -->
  <audio id="startAudio" src="kooisland.mp3" preload="auto"></audio>

  <script>
    const audio = document.getElementById('startAudio');
    const startOverlay = document.getElementById('startOverlay');
    const selectionOverlay = document.getElementById('selectionOverlay');
    const gameEmbedContainer = document.getElementById('gameEmbedContainer');
    const gameIframe = document.getElementById('gameIframe');

    function showGamesSelection() {
      audio.play().catch(err => console.log("Audio play prevented:", err));

      setTimeout(() => {
        startOverlay.style.display = 'none';
        selectionOverlay.style.display = 'block';
      }, 250);
    }

    function launchGame(gameUrl) {
      audio.pause();
      audio.currentTime = 0;
      gameIframe.src = gameUrl;
      gameEmbedContainer.style.display = 'flex';
    }

    function closeGameEmbed() {
      gameIframe.src = '';
      gameEmbedContainer.style.display = 'none';
      audio.play().catch(err => console.log("Audio play prevented:", err));
    }

    function openCustomGame() {
      const customUrl = prompt("Enter custom game URL (e.g., https://example.com):");
      if (customUrl) {
        let formattedUrl = customUrl.trim();
        if (!formattedUrl.startsWith('http://') && !formattedUrl.startsWith('https://')) {
          formattedUrl = 'https://' + formattedUrl;
        }
        launchGame(formattedUrl);
      }
    }

    function goToDashboard() {
      window.location.href = 'dashboard.html';
    }

    function toggleMenuModal() {
      const modal = document.getElementById('menuModal');
      if (modal.classList.contains('active')) {
        modal.classList.remove('active');
        setTimeout(() => {
          modal.style.display = 'none';
        }, 300);
      } else {
        modal.style.display = 'flex';
        setTimeout(() => {
          modal.classList.add('active');
        }, 10);
      }
    }

    function logoutUser() {
      window.location.href = 'index.html';
    }
  </script>

</body>
</html>
